spring:
  application:
    name: Dokja Server

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      enabled: false

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  web:
    error:
      whitelabel:
        enabled: false

  mvc:
    problemdetails:
      enabled: true

  jackson:
    datatype:
      enum:
        write-enums-to-lowercase: true
    mapper:
      accept-case-insensitive-enums: true

app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}

server:
  port: 8080
  forward-headers-strategy: native
  http2:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
