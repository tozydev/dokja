name: dokja-dev
services:
  api:
    build:
      dockerfile: ../infra/api.dockerfile
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: dev
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dokja-dev
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/dokja
      DATASOURCE_USERNAME: dokja
      DATASOURCE_PASSWORD: dokja
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: vi
      S3_ACCESS_KEY: dokja
      S3_SECRET_KEY: dokja
    depends_on:
      - keycloak
      - postgres
      - redis
      - rustfs
    profiles:
      - api
    deploy:
      resources:
        limits:
          memory: 768m

  api-full:
    extends:
      service: api
    environment:
      SPRING_PROFILES_ACTIVE: dev,dev-obs
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    depends_on:
      - keycloak
      - postgres
      - redis
      - rustfs
      - otel-collector
      - openobserve
    profiles:
      - full

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    ports:
      - "9000:8080"
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dokja
      KC_BOOTSTRAP_ADMIN_PASSWORD: dokja
      KC_JVM_ARGS: "-Xms64m -Xmx512m"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/dokja-dev-realm.json:/opt/keycloak/data/import/dokja-dev-realm.json:ro
    deploy:
      resources:
        limits:
          memory: 750m

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dokja
      POSTGRES_USER: dokja
      POSTGRES_PASSWORD: dokja
    ports:
      - "9010:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:8-alpine
    ports:
      - "9020:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128m

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9030:9000"
      - "9031:9001"
    environment:
      RUSTFS_ACCESS_KEY: dokja
      RUSTFS_SECRET_KEY: dokja
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLED: true
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          memory: 256m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    ports:
      - "9040:4317"
      - "9041:4318"
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - openobserve
    deploy:
      resources:
        limits:
          memory: 256m
    profiles:
      - obs
      - full

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.0
    ports:
      - "9050:5080"
    environment:
      ZO_ROOT_USER_EMAIL: dokja@dokja.local
      ZO_ROOT_USER_PASSWORD: Dokja@1234
      ZO_HTTP_PORT: "5080"
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data:/data
    deploy:
      resources:
        limits:
          memory: 2048m
    profiles:
      - obs
      - full

volumes:
  keycloak_data:
  postgres_data:
  redis_data:
  rustfs_data:
  openobserve_data:
