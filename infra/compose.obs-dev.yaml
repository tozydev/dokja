name: dokja-obs
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    ports:
      - "9040:4317"
      - "9041:4318"
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - openobserve
    deploy:
      resources:
        limits:
          memory: 256m

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.0
    ports:
      - "9050:5080"
    environment:
      ZO_ROOT_USER_EMAIL: dokja@dokja.local
      ZO_ROOT_USER_PASSWORD: Dokja@1234
      ZO_HTTP_PORT: "5080"
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data:/data
    deploy:
      resources:
        limits:
          memory: 2048m

volumes:
  openobserve_data:
