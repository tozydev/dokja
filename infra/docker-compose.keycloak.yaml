name: dokja-dev
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    ports:
      - "9002:8080"
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dokja
      KC_BOOTSTRAP_ADMIN_PASSWORD: dokja
      KC_JVM_ARGS: "-Xms64m -Xmx512m"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/dokja-dev-realm.json:/opt/keycloak/data/import/dokja-dev-realm.json:ro
    deploy:
      resources:
        limits:
          memory: 750m

volumes:
  keycloak_data:
